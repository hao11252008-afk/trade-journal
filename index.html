<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade Journal</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="交易日志">
<style>
:root{
  --bg:#0b0d10;--card:#13161b;--card2:#191d23;--line:#252a32;--text:#e6e8eb;--muted:#8a919c;
  --green:#3ddc97;--green-bg:rgba(61,220,151,.10);--red:#ef5a5a;--red-bg:rgba(239,90,90,.10);
  --be:#a3abb6;--be-bg:rgba(163,171,182,.08);--gold:#f5c451;--accent:#3ddc97;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.pos{color:var(--green)}.neg{color:var(--red)}.zero{color:var(--be)}.muted{color:var(--muted)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 24px;background:rgba(11,13,16,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.layout{display:flex;min-height:100vh}
.side{width:224px;flex:none;position:sticky;top:0;height:100vh;background:#0e1114;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.content{flex:1;min-width:0}
.brand{font-weight:700;letter-spacing:.08em;font-size:15px;padding:4px 10px 18px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--muted);cursor:pointer}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{background:#151920;color:var(--text)}
.nav.on{background:#1b2028;color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.beta{font-size:9px;letter-spacing:.1em;font-weight:700;color:var(--gold);border:1px solid rgba(245,196,81,.5);border-radius:4px;padding:1px 5px;margin-left:auto}
.page-title .beta{margin-left:6px;vertical-align:middle}
.page-title{font-size:16px;font-weight:700;margin-right:auto;display:flex;align-items:center}
.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.filters label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.fsum{margin-left:auto;display:flex;gap:18px;font-size:12px;color:var(--muted)}
.fsum b{font-family:var(--mono);font-size:14px;color:var(--text)}
.fsum b.pos{color:var(--green)}.fsum b.neg{color:var(--red)}
tr.trow{cursor:pointer}tr.trow:hover td{background:#171b21}
.nowrap{white-space:nowrap}
.tscroll{overflow-x:auto}
tr.zero-n td{opacity:.45}
.qrow{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);line-height:1.6}
.qrow span:first-child{min-width:4.5em}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.qmat{table-layout:fixed}.qmat th{text-transform:none;letter-spacing:0;font-size:12px}
.qcell{border:1px solid var(--line);border-radius:8px;text-align:center;padding:14px}
.qcell.w{background:var(--green-bg)}.qcell.l{background:var(--red-bg)}
.qe{font-size:18px;font-weight:700}
.upd{margin:6px 4px 8px;padding:10px 12px;border-radius:10px;background:rgba(61,220,151,.12);border:1px solid rgba(61,220,151,.5);color:var(--green);cursor:pointer;font-size:13px;animation:fadeIn .4s ease-out}
.upd small{display:block;color:var(--muted);font-size:11px}
.ver{color:#4a5260;font-size:11px;padding:4px 12px}
tr.zero-n td:last-child{opacity:1}
.lown{font-family:inherit;font-size:10px;color:var(--gold);border:1px solid rgba(245,196,81,.4);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:middle}
.rm-an{color:var(--muted)}.rm-an:hover{color:var(--red)}
.rbar{height:8px;background:#1a1e24;border-radius:4px;overflow:hidden}
.rbar div{height:100%;border-radius:4px}.rbar .p{background:var(--green)}.rbar .n{background:var(--red)}
.brand small{display:block;font-weight:400;letter-spacing:0;color:var(--muted);font-size:12px}
main{max-width:1400px;margin:0 auto;padding:20px 24px 60px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:#3a414c}
.btn.primary{background:var(--accent);color:#06140d;border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 9px;font-size:12px}
select.btn{padding-right:28px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{background:none;border:0;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--muted)}
.seg button.on{background:#2a3039;color:var(--text);font-weight:600}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .label{min-width:170px;text-align:center;font-weight:600}
.banner{background:rgba(245,196,81,.08);border:1px solid rgba(245,196,81,.3);color:var(--gold);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-size:22px;font-weight:700;margin-top:4px;font-family:var(--mono)}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.acctinfo{display:flex;gap:24px;flex-wrap:wrap;font-size:13px}
.acctinfo b{font-family:var(--mono)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr) 110px;gap:6px}
.cal .hd{font-size:11px;letter-spacing:.1em;color:var(--muted);text-align:center;padding:6px 0;font-weight:700}
.cal .cell{min-height:84px;background:#0f1216;border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.cal .cell.empty{background:transparent;border-color:transparent}
.cal .cell.has{cursor:pointer}
.cal .cell.has:hover{filter:brightness(1.25)}
.cal .cell.w{background:var(--green-bg);border-color:rgba(61,220,151,.45)}
.cal .cell.l{background:var(--red-bg);border-color:rgba(239,90,90,.45)}
.cal .cell.b{background:var(--be-bg);border-color:rgba(163,171,182,.35)}
.cal .cell.today{box-shadow:inset 0 0 0 1.5px #5b8def}
.cal .cell.today .dn{color:#7aa7ff}
.cal .dn{font-weight:700}
.cal .pv{font-family:var(--mono);font-weight:700;font-size:15px}
.cal .wr{font-family:var(--mono);font-size:11px;opacity:.85}
.cal .wk{background:var(--card2)}
/* table */
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.day{cursor:pointer}
tr.day:hover td{background:#171b21}
tr.sub td{background:#0f1216;font-size:13px;cursor:pointer}
tr.sub:hover td{background:#141820}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-family:var(--mono);font-size:12px;border:1px solid}
.badge.w{color:var(--green);border-color:rgba(61,220,151,.45);background:var(--green-bg)}
.badge.l{color:var(--red);border-color:rgba(239,90,90,.45);background:var(--red-bg)}
.badge.b{color:var(--be);border-color:rgba(163,171,182,.35);background:var(--be-bg)}
.sym{display:inline-block;background:#222730;border:1px solid #2f3540;border-radius:5px;padding:1px 7px;font-family:var(--mono);font-size:12px;margin-right:4px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:12px;margin:2px 4px 2px 0;cursor:pointer;user-select:none}
.chip.on{background:rgba(61,220,151,.14);border-color:rgba(61,220,151,.6);color:var(--green)}
.chip.static{cursor:default}
.dir{font-size:12px;font-weight:700}
.dir.long{color:var(--green)}.dir.short{color:var(--red)}
/* stars */
.stars{position:relative;display:inline-block;width:110px;height:22px;vertical-align:middle}
.stars.sm{width:70px;height:14px}
.stars .row{position:absolute;inset:0;display:flex}
.stars .row svg{width:22px;height:22px;flex:none}
.stars.sm .row svg{width:14px;height:14px}
.stars .fg{overflow:hidden;white-space:nowrap}
.stars.input{cursor:pointer}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;width:100%;max-width:860px;padding:20px 22px}
.modal.wide{max-width:980px}
.modal h2{margin:0 0 16px;font-size:18px;display:flex;align-items:center;gap:10px}
.modal h2 .x{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid .span2{grid-column:span 2}.grid .span4{grid-column:span 4}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;background:#0f1216;border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:#4a5260}
.f textarea{min-height:120px;resize:vertical}
.tbox{display:flex;align-items:center;background:#0f1216;border:1px solid var(--line);border-radius:8px;padding:0 10px;cursor:text}
.tbox:focus-within{border-color:#4a5260}
.f .tbox input{width:2.4ch;border:0;background:none;padding:8px 0;text-align:center;border-radius:0}
.tbox span{color:var(--muted);padding:0 2px}
.preview{display:flex;gap:22px;flex-wrap:wrap;background:#0f1216;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.preview div span{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.preview div b{font-family:var(--mono);font-size:16px}
.drop{border:1.5px dashed #343b46;border-radius:10px;padding:16px;text-align:center;color:var(--muted);cursor:pointer}
.drop.hover{border-color:var(--accent);color:var(--accent)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.thumb{position:relative;width:150px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#0f1216}
.thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.thumb .rm{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);border:0;border-radius:6px;color:#fff;cursor:pointer;padding:0 7px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.gallery img{width:100%;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}
.notes{white-space:pre-wrap;background:#0f1216;border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:40px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kv div{background:#0f1216;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kv span{display:block;font-size:11px;color:var(--muted)}
.kv b{font-family:var(--mono)}
.tcard{display:flex;gap:14px;align-items:center;background:#0f1216;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}
.tcard:hover{border-color:#3a414c}
.tcard .tb{width:120px;height:72px;border-radius:6px;object-fit:cover;background:#1a1e24;flex:none}
.tcard .mid{flex:1;min-width:0}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:40;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox img{max-width:96vw;max-height:94vh}
.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.sec{margin-top:18px}
.sec h4{margin:0 0 8px;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.list-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.empty-msg{color:var(--muted);text-align:center;padding:30px}
/* monthly performance */
.pbars{display:flex;gap:8px;align-items:stretch}
.pbar{flex:1;display:flex;flex-direction:column;cursor:pointer;min-width:0}
.pbar:hover .pfill{filter:brightness(1.25)}
.pup{display:flex;align-items:flex-end;border-bottom:1px solid #4a5260}.pdn{display:flex;align-items:flex-start}
.pfill{width:100%;border-radius:4px 4px 0 0}.pfill.p{background:var(--green)}.pfill.n{background:var(--red);border-radius:0 0 4px 4px}
.pfill.grow{animation:growUp .7s cubic-bezier(.22,1,.36,1) both;transform-origin:bottom}.pdn .pfill.grow{transform-origin:top}
@keyframes growUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.plab{text-align:center;font-size:11px;color:var(--muted);margin-top:6px;white-space:nowrap}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;min-height:118px}
.pcard:hover{filter:brightness(1.2)}
.pcard.w{background:var(--green-bg);border-color:rgba(61,220,151,.45)}.pcard.l{background:var(--red-bg);border-color:rgba(239,90,90,.45)}.pcard.b{background:var(--be-bg)}
.pcard.fut{opacity:.45;cursor:default}.pcard.fut:hover{filter:none}
.pcard.cur{box-shadow:inset 0 0 0 1.5px #5b8def}
.pcard.pin{animation:fadeIn .42s ease-out both}
.pcard .pm{font-weight:700;margin-bottom:6px}.pcard .pv{font-family:var(--mono);font-size:20px;font-weight:700}
.ppct{font-family:var(--mono);font-size:13px;margin-top:2px}.pmeta{font-size:12px;color:var(--muted);margin-top:6px}.pempty{color:var(--muted);font-size:13px;margin-top:14px}
.ytab th,.ytab td{text-align:center;padding:8px 6px;font-size:12px}.ytab th:first-child,.ytab td:first-child{text-align:left}
.ycell{cursor:pointer}.ycell:hover{background:#171b21}.ypct{font-size:10px;opacity:.75}
.ytab tr.ysel td{background:#151a21}.ytab a{color:inherit}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#app.fade{animation:fadeIn .38s ease-out}
.cal.anim .cell{opacity:0;animation:fadeIn .42s ease-out forwards}
@media (prefers-reduced-motion:reduce){#app.fade,.cal.anim .cell,.pcard.pin,.pfill.grow{animation:none;opacity:1}}
svg text{fill:var(--muted);font-size:11px;font-family:var(--mono)}
@media (max-width:760px){
  .top,main{padding-left:16px;padding-right:16px}
  .layout{flex-direction:column}.side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
  .side .brand{border:0;padding:4px 10px;margin:0}.side>div[style]{display:none}.fsum{margin-left:0}
  .cal{grid-template-columns:repeat(7,1fr)}.cal .wk,.cal .wkh{display:none}
  .grid,.kv{grid-template-columns:repeat(2,1fr)}.grid .span4{grid-column:span 2}
  .hide-sm{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .qgrid{grid-template-columns:1fr}
  .pgrid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="layout"><aside class="side" id="side"></aside><div class="content"><header class="top" id="top"></header>
<main id="app"></main></div></div>
<div id="modal-root"></div>
<input type="file" id="file-img" accept="image/*" multiple hidden>
<input type="file" id="file-import" accept="application/json,.json" hidden>

function tbWire(box,onChange){
  const ins=[...box.querySelectorAll('input')];
  ins.forEach((inp,k)=>{
    inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(0,2);
      if(inp.value.length===2&&k<2){ins[k+1].focus();ins[k+1].select()}onChange()});
    inp.addEventListener('keydown',e=>{
      if(e.key==='Backspace'&&!inp.value&&k>0){e.preventDefault();ins[k-1].focus();ins[k-1].value=ins[k-1].value.slice(0,1);onChange()}
      else if(e.key==='ArrowLeft'&&inp.selectionStart===0&&k>0){e.preventDefault();ins[k-1].focus()}
      else if(e.key==='ArrowRight'&&inp.selectionEnd===inp.value.length&&k<2){e.preventDefault();ins[k+1].focus()}
      else if((e.key===':'||e.key==='：')&&k<2){e.preventDefault();ins[k+1].focus();ins[k+1].select()}});
    inp.addEventListener('paste',e=>{const v=parseTime((e.clipboardData||window.clipboardData).getData('text'));if(v){e.preventDefault();e.stopPropagation();tbSet(box,v);onChange()}});

function calendarHTML(all,anim=false){

  const cells=[];for(let i=0;i<first;i++)cells.push(null);for(let d=1;d<=n;d++)cells.push(`${ym}-${pad(d)}`);while(cells.length%7)cells.push(null);

   ${g}<line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="#4a5260" stroke-dasharray="4 4"/>
   <clipPath id="eqclip"><rect id="eqrect" x="0" y="0" width="${anim?0:W}" height="${H}"/></clipPath>
   <g clip-path="url(#eqclip)"><g id="eqg2">
   <path d="${line} L${X(ys.length-1)},${z} L${X(0)},${z} Z" fill="url(#eqg)"/>

  // images
  async function drawThumbs(){
    for(const im of imgs)if(im.src===null)im.src=imgCache[im.id]??(imgCache[im.id]=await DB.get('images',im.id)||'');
    $('#fThumbs').innerHTML=imgs.map((im,i)=>`<div class="thumb"><img src="${im.src}" data-i="${i}"><button class="rm" data-i="${i}">✕</button></div>`).join('');
    ov.querySelectorAll('#fThumbs .rm').forEach(b=>b.onclick=()=>{imgs.splice(+b.dataset.i,1);drawThumbs()});
    ov.querySelectorAll('#fThumbs img').forEach(m=>m.onclick=()=>lightbox(m.src));
  }
  const addFiles=files=>{[...files].filter(f=>f.type.startsWith('image/')).forEach(f=>{const r=new FileReader();r.onload=()=>{imgs.push({id:uid(),src:r.result,isNew:true});drawThumbs()};r.readAsDataURL(f)})};
  const fileIn=document.getElementById('file-img');
  $('#fDrop').onclick=()=>{fileIn.value='';fileIn.onchange=()=>addFiles(fileIn.files);fileIn.click()};
  $('#fDrop').ondragover=e=>{e.preventDefault();e.currentTarget.classList.add('hover')};
  $('#fDrop').ondragleave=e=>e.currentTarget.classList.remove('hover');
  $('#fDrop').ondrop=e=>{e.preventDefault();e.currentTarget.classList.remove('hover');addFiles(e.dataTransfer.files)};
  const onPaste=e=>{if(!document.body.contains(ov)){document.removeEventListener('paste',onPaste);return}
    const files=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith('image/')).map(i=>i.getAsFile());if(files.length){e.preventDefault();addFiles(files)}};
  document.addEventListener('paste',onPaste);
  drawThumbs();upd();
  $('#fSave').onclick=async()=>{
    read();const err=$('#fErr');
    if(!isFinite(d.entry)||!isFinite(d.exit)||!d.qty)return err.textContent=t('errPrice');
    if(!isFinite(d.entryTime)||!isFinite(d.exitTime)||d.exitTime<d.entryTime)return err.textContent=t('errTime');
    for(const im of imgs)if(im.isNew){await DB.put('images',im.id,im.src);imgCache[im.id]=im.src}
    const keep=imgs.map(i=>i.id);for(const id of origImgs)if(!keep.includes(id)){await DB.del('images',id);delete imgCache[id]}
    d.images=keep;
    const i=S.trades.findIndex(x=>x.id===d.id);if(i>=0)S.trades[i]=d;else S.trades.push(d);
    await save();document.removeEventListener('paste',onPaste);closeModal(ov);
    const c=calc(d);if(UI.period!=='all'){UI.anchor=c.date;UI.calMonth=c.date.slice(0,7)}
    render();
  };
}
/* ---------- accounts ---------- */
function openAccountForm(existing){
  const html=`<h2>${existing?t('editAccount'):(S.accounts.length?t('addAccount').replace('+ ',''):t('welcome'))}<button class="btn x">✕</button></h2>
   <div class="grid"><div class="f span2"><label>${t('accName')}</label><input id="aN" placeholder="Lucid 50K Eval"></div>
   <div class="f"><label>${t('startBal')} ($)</label><input id="aS" type="number" min="0" placeholder="50000"></div>
   <div class="f"><label>${t('rValue')} ($)</label><input id="aR" type="number" min="0" placeholder="250"></div></div>
   <div class="foot"><span class="neg" id="aErr" style="margin-right:auto"></span>${existing?`<button class="btn danger" id="aDel">${t('del')}</button>`:''}<button class="btn x">${t('cancel')}</button><button class="btn primary" id="aSave">${t('save')}</button></div>`;
  const ov=openModal(html),$=s=>ov.querySelector(s);
  if(existing){$('#aN').value=existing.name;$('#aS').value=existing.start;$('#aR').value=existing.rValue}
  $('#aSave').onclick=async()=>{
    const name=$('#aN').value.trim(),start=parseFloat($('#aS').value),rValue=parseFloat($('#aR').value);
    if(!name||!(start>=0)||!(rValue>0))return $('#aErr').textContent=t('errAcc');
    if(existing)Object.assign(existing,{name,start,rValue});
    else{const a={id:uid(),name,start,rValue};S.accounts.push(a);if(S.accounts.length===1)S.settings.account=a.id}
    await save();closeModal(ov);if(document.querySelector('#setList'))refreshSettings();render();
  };
  if(existing)$('#aDel').onclick=async()=>{if(!confirm(t('deleteAcc')))return;
    for(const tr of S.trades.filter(x=>x.accountId===existing.id))for(const i of tr.images||[])await DB.del('images',i);
    S.trades=S.trades.filter(x=>x.accountId!==existing.id);S.accounts=S.accounts.filter(a=>a!==existing);
    if(S.settings.account===existing.id)S.settings.account='all';await save();closeModal(ov);refreshSettings();render()};
}
/* ---------- settings ---------- */
function settingsBody(){
  const custom=S.tags.filter(x=>!x.builtin);
  return `<div class="sec" style="margin-top:0"><h4>${t('accounts')}</h4><div id="setList">${S.accounts.map(a=>`<div class="list-row"><b style="flex:1">${esc(a.name)}</b><span class="mono muted">${money(a.start,false)} · 1R ${money(a.rValue,false)}</span><button class="btn sm" data-acc="${a.id}">${t('edit')}</button></div>`).join('')}</div>
    <button class="btn sm" id="sAdd" style="margin-top:8px">${t('addAccount')}</button></div>
   <div class="sec grid"><div class="f"><label>${t('beThreshold')}</label><input id="sBe" type="number" step="0.05" min="0" value="${S.settings.be}"></div>
    <div class="f span2"><label>${t('defComm')}</label><input id="sCom" type="number" step="0.01" min="0" value="${S.settings.commission}"></div></div>
   <div class="sec"><h4>${t('customTags')}</h4>${custom.length?custom.map(tg=>`<span class="chip static">${esc(tg.name)} <a href="#" data-tag="${tg.id}" style="color:var(--red);text-decoration:none">✕</a></span>`).join(''):`<span class="muted">${t('noCustomTags')}</span>`}</div>
   <div class="sec"><h4>${t('backup')}</h4><div class="bar"><button class="btn" id="sExp">${t('exportB')}</button><button class="btn" id="sImp">${t('importB')}</button><span class="muted">${t('lastBackup')}: ${S.settings.lastBackup?new Date(S.settings.lastBackup).toLocaleString():t('never')}</span></div>
    <p class="muted" style="font-size:12px">${t('backupWarn')}</p></div>`;
}
let setOv=null;
function openSettings(){
  setOv=openModal(`<h2>${t('settings')}<button class="btn x">✕</button></h2><div id="setBody"></div>`);refreshSettings();
}
function refreshSettings(){
  if(!setOv||!document.body.contains(setOv))return;const b=setOv.querySelector('#setBody');b.innerHTML=settingsBody();
  b.querySelectorAll('[data-acc]').forEach(x=>x.onclick=()=>openAccountForm(acct(x.dataset.acc)));
  b.querySelector('#sAdd').onclick=()=>openAccountForm();
  b.querySelector('#sBe').onchange=e=>{S.settings.be=Math.max(0,parseFloat(e.target.value)||0);save();render()};
  b.querySelector('#sCom').onchange=e=>{S.settings.commission=Math.max(0,parseFloat(e.target.value)||0);save()};
  b.querySelectorAll('[data-tag]').forEach(x=>x.onclick=e=>{e.preventDefault();const id=x.dataset.tag;S.tags=S.tags.filter(tg=>tg.id!==id);S.trades.forEach(tr=>tr.tags=(tr.tags||[]).filter(i=>i!==id));save();refreshSettings();render()});
  b.querySelector('#sExp').onclick=exportBackup;
  b.querySelector('#sImp').onclick=()=>{const f=document.getElementById('file-import');f.value='';f.onchange=()=>importBackup(f.files[0]);f.click()};
}
async function exportBackup(){
  S.settings.lastBackup=Date.now();await save();
  const data={app:'trade-journal',version:1,exportedAt:new Date().toISOString(),state:S,images:await DB.all('images')};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
  a.download=`trade-journal-backup-${nyDate(Date.now())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  refreshSettings();render();
}
async function importBackup(file){
  if(!file)return;
  try{const data=JSON.parse(await file.text());if(data.app!=='trade-journal'||!data.state)throw new Error('bad file');
    if(!confirm(t('importConfirm')))return;
    await DB.clear('images');for(const[k,v]of Object.entries(data.images||{}))await DB.put('images',k,v);
    for(const k in imgCache)delete imgCache[k];
    S=data.state;ensureTags();migrate();await save();alert(t('importOk'));refreshSettings();render();
  }catch(e){alert('Import failed: '+e.message)}
}
function migrate(){S.trades.forEach(tr=>{if(tr.setupQ===undefined){tr.setupQ=tr.rating||0;tr.execQ=tr.execQ||0;delete tr.rating}})}
function ensureTags(){BUILTIN_TAGS.forEach(([k,zh])=>{if(!S.tags.some(x=>x.builtin===k))S.tags.push({id:'b_'+k,name:zh,builtin:k})})}
/* ---------- update check ---------- */
const verNum=v=>String(v).split('.').map(n=>+n||0).reduce((a,n)=>a*1000+n,0);
async function checkUpdate(){
  if(!location.protocol.startsWith('http'))return;
  try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const{version}=await r.json();
    if(version&&verNum(version)>verNum(APP_VERSION)&&UI.newVer!==version){UI.newVer=version;renderSide()}}catch(e){}
}
/* ---------- boot ---------- */
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{
  try{await DB.open();const st=await DB.get('kv','state');if(st)S=Object.assign(S,st,{settings:Object.assign(S.settings,st.settings)})}
  catch(e){alert('Storage unavailable: '+e.message)}
  ensureTags();
  migrate();
  UI.anchor=nyDate(Date.now());UI.calMonth=UI.anchor.slice(0,7);UI.perfYear=+UI.anchor.slice(0,4);
  document.documentElement.lang=S.settings.lang==='zh'?'zh':'en';
  render({anim:true});
  if(!S.accounts.length)openAccountForm();
  setTimeout(checkUpdate,3000);setInterval(checkUpdate,120000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>drawEquity(inPeriod(enriched())),150)});
})();
</script>
</body>
</html>
